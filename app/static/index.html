<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente de documentos</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14232e;--mute:#5d7280;--line:#cbd8e0;--acc:#0b6e8a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b23;--card:#172733;--ink:#e6eef3;--mute:#8fa5b3;--line:#2b4050;--acc:#4cc3e3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;gap:16px;max-width:1100px;margin:0 auto;padding:16px;min-height:100vh}
@media(max-width:760px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h1{font-size:1.2rem;margin:0 0 12px}h2{font-size:1rem;margin:0 0 8px}
button{font:inherit;border:0;border-radius:8px;background:var(--acc);color:#fff;padding:9px 16px;cursor:pointer}
button.ghost{background:none;color:var(--mute);padding:2px 8px}button:disabled{opacity:.5}
input[type=text]{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:20px 12px;text-align:center;color:var(--mute);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--bg))}
.drop svg{width:28px;height:28px;stroke:var(--acc);margin-bottom:6px}
.drop strong{color:var(--ink);font-weight:600}.drop small{font-size:.78rem}
.doc{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem;word-break:break-all}
.doc small{color:var(--mute)}
#chat{display:flex;flex-direction:column;gap:12px;min-height:60vh}
.msg{max-width:90%;padding:10px 14px;border-radius:12px;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--acc);color:#fff}.bot{background:var(--bg);border:1px solid var(--line)}
.cite{display:inline-block;background:var(--acc);color:#fff;border-radius:4px;font-size:.75rem;padding:0 5px;margin:0 1px}
.src{font-size:.82rem;color:var(--mute);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.src details{margin:3px 0}.src summary{cursor:pointer}
form{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mute);white-space:nowrap;cursor:pointer}
.mode{font-size:.75rem;color:var(--mute);margin-top:8px}
</style></head><body>
<div class="app">
<aside class="card"><h1>Documentos</h1>
 <label class="drop" id="drop">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
  <strong>Enviar documentos</strong><small>PDF, DOCX, XLSX ou CSV · arraste ou clique</small>
  <input id="file" type="file" multiple accept=".pdf,.docx,.xlsx,.xls,.csv" hidden></label>
 <div id="status" style="font-size:.85rem;color:var(--mute);margin:8px 0"></div>
 <div id="docs"></div></aside>
<main class="card"><h1>Pergunte aos seus documentos</h1>
 <div id="chat"><div class="msg bot">Envie documentos à esquerda e faça perguntas. Cada resposta traz as fontes usadas.</div></div>
 <form id="f"><input type="text" id="q" placeholder="Digite sua pergunta" required style="min-width:200px">
  <label class="opt"><input type="checkbox" id="hy" checked> Busca híbrida</label>
  <label class="opt"><input type="checkbox" id="rr" checked> Usar reranking</label>
  <button id="go">Perguntar</button></form></main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function loadDocs(){
  const d=await (await fetch('/documents')).json();
  $('docs').innerHTML=d.length?d.map(x=>`<div class="doc"><span>${esc(x.source)}<br><small>${x.chunks} trechos</small></span><button class="ghost" data-n="${esc(x.source)}" title="Remover">✕</button></div>`).join(''):'<small>Nenhum documento ainda.</small>';
}
$('docs').onclick=async e=>{const n=e.target.dataset.n;if(n){await fetch('/documents/'+encodeURIComponent(n),{method:'DELETE'});loadDocs()}};
async function upload(files){
  if(!files.length)return;const fd=new FormData();[...files].forEach(f=>fd.append('files',f));
  $('status').textContent='Indexando…';
  const r=await (await fetch('/documents',{method:'POST',body:fd})).json();
  $('status').textContent=r.map(x=>x.error?`${x.source}: ${x.error}`:`${x.source}: ${x.chunks} trechos`).join(' · ');
  loadDocs();
}
$('file').onchange=e=>upload(e.target.files);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};
$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');upload(e.dataTransfer.files)};
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;$('chat').appendChild(d);d.scrollIntoView({block:'end'});return d}
$('f').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();$('q').value='';$('go').disabled=true;
  add('me',esc(q));const w=add('bot','Buscando…');
  try{
    const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,rerank:$('rr').checked,hybrid:$('hy').checked})});
    const j=await r.json();if(!r.ok)throw new Error(j.detail);
    const used=new Set([...j.answer.matchAll(/\[(\d+)\]/g)].map(m=>+m[1]));
    const src=j.sources.filter(s=>used.has(s.id));
    w.innerHTML=esc(j.answer).replace(/\[(\d+)\]/g,'<span class="cite">$1</span>')+
     (src.length?'<div class="src">'+src.map(s=>`<details><summary><span class="cite">${s.id}</span> ${esc(s.source)} · ${esc(s.location)} · ${esc(s.origin)} · ${s.score_type} ${s.relevance}</summary>${esc(s.snippet)}…</details>`).join('')+'</div>':'')+`<div class="mode">Modo: ${esc(j.mode||'')}</div>`;
  }catch(err){w.textContent='Erro: '+err.message}
  $('go').disabled=false;
};
loadDocs();
</script></body></html>
